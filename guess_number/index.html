<!DOCTYPE html>
<html>

<head>
    <title> Guess a Number </title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Guess the Number!</h1>
        <h2>Guess a number between 1 and 99 in seven attempts!</h2>
        <script src="js/script.js" defer></script>
    </header>
    <br>
    <div id="main">
        <div id="left-panel"></div>
        <div id="center-panel">
            Enter a guess:
            <input type="text" id="playerGuess" size="10">
            <button id="guessBtn"> Guess </button> <br>
            <button id="resetBtn"> Reset </button>
            <div id="feedback"></div>
            <div> Previous Guesses:
                <span id="guesses"></span>
            </div>
        </div>
        <div id="right-panel"></div>
    </div>
    <span id="misc">
        <p id="misc-left"> Background Image <a href="https://share.google/xUMlwY7tOjyvR8HsI" target="_blank"> source</a>
        </p>
        <p id="misc-right"></p>
    </span>
    <footer>
        <!--The footer will be added here -->

        <div>
            <p>&copy; 2026 Tyler Kenney. All rights reserved.</p>

</html>
